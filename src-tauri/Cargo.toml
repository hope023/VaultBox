[package]
name = "vaultbox"
version = "0.1.5"
description = "VaultBox 文件保险箱：加密隐藏文件夹"
authors = ["hope"]
edition = "2024"

[lib]
name = "vaultbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
walkdir = "2"
hex = "0.4"
tempfile = "3"
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
